name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  firetv:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.HOTGO_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # O ubuntu-latest já vem com o Android SDK (ANDROID_HOME); o setup-android quebrava
      # tentando instalar o pacote 'tools', que não existe mais
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore fixa (se configurada nos segredos)
        if: env.KEYSTORE_B64 != ''
        run: |
          # aceita base64 gerado no Windows (quebras CRLF ou cabeçalhos do certutil)
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ' | sed 's/-----[A-Z]*-----//g' | base64 -d > "$RUNNER_TEMP/hotgo.jks"
          echo "HOTGO_KEYSTORE=$RUNNER_TEMP/hotgo.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: firetv
        env:
          HOTGO_KEYSTORE_PASSWORD: ${{ secrets.HOTGO_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - run: cp firetv/app/build/outputs/apk/release/app-release.apk hotgo-tv-firetv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hotgo-tv-firetv
          path: hotgo-tv-firetv.apk

  # App da Samsung (.wgt). Assina com o certificado de autor do segredo HOTGO_TIZEN_AUTHOR_P12_B64 (o mesmo
  # que já está na TV, para instalar por cima sem perder o login). Sem o segredo, gera um certificado
  # descartável só para conferir o pacote, e a Release não leva o .wgt.
  samsung:
    runs-on: ubuntu-latest
    env:
      AUTHOR_B64: ${{ secrets.HOTGO_TIZEN_AUTHOR_P12_B64 }}
    outputs:
      signed: ${{ steps.cert.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: cert
        name: Certificado de autor
        run: |
          mkdir -p "$RUNNER_TEMP/tizen-cert"
          if [ -n "$AUTHOR_B64" ]; then
            printf '%s' "$AUTHOR_B64" | tr -d '\r\n\t ' | sed 's/-----[A-Z]*-----//g' | base64 -d > "$RUNNER_TEMP/tizen-cert/author.p12"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - run: node scripts/build-tizen-app.js "$RUNNER_TEMP/tizen-cert"
      - uses: actions/upload-artifact@v4
        with:
          name: hotgo-tv-samsung
          path: hotgo-tv-samsung.wgt

  # Publica a Release v<versão do package.json> a cada push na main (ou tag v*).
  # O link fixo para o Downloader do Fire TV fica em
  # https://github.com/cruzestacio/hotgo-tv/releases/latest/download/hotgo-tv-firetv.apk
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [overlay, firetv, samsung]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: hotgo-tv-firetv
      - if: needs.samsung.outputs.signed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: hotgo-tv-samsung
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            hotgo-tv-firetv.apk
            ${{ needs.samsung.outputs.signed == 'true' && 'hotgo-tv-samsung.wgt' || '' }}
